name: Build GCC toolchain

on:
  workflow_dispatch:
    inputs:
      gcc_version:
        description: GCC version to build
        required: true
        type: string

      revision:
        description: Optional rebuild revision, e.g. 2 creates -r2
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest

    outputs:
      release_tag: ${{ steps.vars.outputs.release_tag }}

    steps:
      - id: vars
        shell: bash
        env:
          GCC_VERSION: ${{ inputs.gcc_version }}
          REVISION: ${{ inputs.revision }}
        run: |
          tag="gcc-${GCC_VERSION}-x86_64"

          if [[ -n "${REVISION}" ]]; then
            if ! [[ "${REVISION}" =~ ^[1-9][0-9]*$ ]]; then
              echo "revision must be a positive integer"
              exit 1
            fi

            tag="${tag}-r${REVISION}"
          fi

          echo "release_tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Release tag: ${tag}"

  create-release:
    needs: prepare
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
          GCC_VERSION: ${{ inputs.gcc_version }}
          REVISION: ${{ inputs.revision }}
        run: |
          if [[ -n "${REVISION}" ]]; then
            title="GCC ${GCC_VERSION} x86_64 toolchain (revision ${REVISION})"
            notes="Hermetic GCC ${GCC_VERSION} x86_64 Linux toolchain, rebuild revision ${REVISION}, built by GitHub Actions."
          else
            title="GCC ${GCC_VERSION} x86_64 toolchain"
            notes="Hermetic GCC ${GCC_VERSION} x86_64 Linux toolchain built by GitHub Actions."
          fi

          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --draft \
            --title "${title}" \
            --notes "${notes}"

  build:
    needs:
      - prepare
      - create-release

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show runner resources
        run: |
          nproc
          free -h
          df -h
          docker version

      - name: Build toolchain
        run: |
          mkdir -p dist

          ./build.sh \
            "${{ inputs.gcc_version }}" \
            x86_64 \
            dist

      - name: Generate checksum
        run: |
          artifact="$(find dist -name '*.tar.xz' -print -quit)"
          sha256sum "${artifact}" > "${artifact}.sha256"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          gh release upload "${TAG}" \
            dist/*.tar.xz \
            dist/*.sha256 \
            --repo "${GITHUB_REPOSITORY}"

  publish:
    needs:
      - prepare
      - build

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          gh release edit "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false